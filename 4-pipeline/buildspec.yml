# ============================================================
# buildspec.yml - AWS CodeBuild
# ============================================================
# Este archivo es el "guion" que CodeBuild sigue para ejecutar
# el pipeline de CI/CD. Tiene 4 fases:
#
#   install    -> instala dependencias (npm install)
#   pre_build  -> verifica el entorno antes de construir
#   build      -> levanta la API y corre los tests
#   post_build -> genera el reporte y limpia
#
# El runner-local.ps1 ejecuta EXACTAMENTE las mismas fases
# en tu maquina, para que puedas ver el pipeline antes de
# subirlo a AWS.
#
# Documentacion AWS:
# https://docs.aws.amazon.com/codebuild/latest/userguide/build-spec-ref.html
# ============================================================

version: 0.2

env:
  variables:
    NODE_ENV: "test"
    API_PORT: "3001"
    API_BASE_URL: "http://localhost:3001"
    SLA_MS: "800"

phases:

  # ── FASE 1: INSTALL ─────────────────────────────────────
  # Instala las dependencias del proyecto.
  # En CodeBuild este paso corre dentro del contenedor
  # (imagen: aws/codebuild/standard:7.0 con Node 20).
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== FASE INSTALL ==="
      - echo "Node $(node --version) | npm $(npm --version)"
      - npm install
      - echo "Dependencias instaladas OK"

  # ── FASE 2: PRE_BUILD ────────────────────────────────────
  # Verifica que el entorno este listo ANTES de correr tests.
  # Si algo falla aqui, el build se aborta con estado FAILED.
  #
  # Los datos NO estan versionados: se generan aqui, en cada corrida.
  #   1) Faker genera 2-servicio/db.seed.json (estado original)
  #   2) restaurar-seed copia el seed a 2-servicio/db.json (copia de trabajo)
  pre_build:
    commands:
      - echo "=== FASE PRE_BUILD ==="
      - echo "Generando datos con Faker..."
      - node 1-generar-datos/generar-datos.js
      - echo "Preparando la copia de trabajo (seed -> db.json)..."
      - node 4-pipeline/restaurar-seed.js
      - echo "Levantando API en puerto $API_PORT (background)..."
      - npx json-server 2-servicio/db.json --port $API_PORT &
      - sleep 3
      - echo "Comprobando que la API responde..."
      - node -e "fetch('http://localhost:'+process.env.API_PORT+'/productos').then(r=>{ if(r.ok) { console.log('API OK - status '+r.status); } else { console.error('API ERROR'); process.exit(1); } }).catch(e=>{ console.error('API no responde: '+e.message); process.exit(1); })"
      - echo "Pre-build OK"

  # ── FASE 3: BUILD ────────────────────────────────────────
  # Corre los tests. Si alguno falla, process.exit(1) hace que
  # CodeBuild marque el build como FAILED.
  build:
    commands:
      - echo "=== FASE BUILD: corriendo tests ==="
      - npm test
      - echo "Tests completados"

  # ── FASE 4: POST_BUILD ───────────────────────────────────
  # Siempre corre (incluso si build fallo) para dejar el reporte.
  # En AWS este reporte se sube como artefacto a S3.
  post_build:
    commands:
      - echo "=== FASE POST_BUILD ==="
      - |
        if [ -f 4-pipeline/test-report.json ]; then
          echo "Reporte generado:"
          cat 4-pipeline/test-report.json
        else
          echo "No se genero reporte"
        fi
      - echo "Pipeline finalizado"

# ── ARTEFACTOS ───────────────────────────────────────────────
# En AWS, estos archivos se suben a S3 automaticamente.
# En local, los encuentras en la carpeta 4-pipeline/.
artifacts:
  files:
    - 4-pipeline/test-report.json
  discard-paths: yes

# ── NOTA sobre CodeBuild Test Reports ────────────────────────
# CodeBuild puede mostrar resultados con graficos en la consola SI el
# reporte esta en un formato estandar (JUNITXML, CUCUMBERJSON, etc.).
# Nuestro test-report.json es JSON PROPIO, no JUnit — por eso NO usamos
# la seccion "reports:" (declararla con un formato que no coincide hace
# fallar el build). Para habilitarlo en produccion, el runner deberia
# emitir JUnit XML (ej. con jest-junit) y ahi si se agrega:
#   reports:
#     tienda-test-report:
#       files: [ "4-pipeline/junit.xml" ]
#       file-format: "JUNITXML"
